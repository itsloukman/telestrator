name: pr-title

# PRs are squash-merged with the PR title as the commit message, so the title is what
# release-please reads. Reject any title that isn't a Conventional Commit.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The description "{subject}" in "{title}" must start lowercase,
            e.g. "fix(ui): keep pin inside the frame". See https://www.conventionalcommits.org/en/v1.0.0/
