<!doctype html>
<!--
	telestrator: frame-accurate feedback on a rendered video, for AI agents.
	The viewer, one filmstrip of the whole video with a comments track under it, and a sidebar where you write:
	a note lands at the playhead; attach something you point at in the frame, a drawing, or a dragged range.
	Served by `npx telestrator <video>`; notes live next to the video in .telestrator/, where the MCP
	server (`npx telestrator mcp`) reads them, replies and resolves.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>telestrator</title>
<script>document.documentElement.dataset.theme = localStorage.getItem('vl:theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); document.documentElement.classList.toggle('side-off', localStorage.getItem('vl:side') === '0');</script>
<style>
	/* A calm editor: the video as large as it fits, with nothing around the frame that could pass for part of it; the
	   transport and the timeline below, the inspector on the right. Dark by default; the light theme below swaps the tokens. */
	:root {
		--bg: #131314; --chrome: #131314; --panel: #1b1b1d; --panel-2: #232326; --well: #0e0e0f;
		--line: rgba(255,255,255,0.07); --line-2: rgba(255,255,255,0.12);
		--ink: #ededec; --muted: #a9a9a6; --dim: #7b7b78; --faint: #57575a;
		--btn: rgba(255,255,255,0.06); --btn-hover: rgba(255,255,255,0.1); --btn-on: rgba(255,255,255,0.14);
		--head: #ef6a4c; --pin: #ef6a4c; --range: #6fb3ff; --draw: #ff4f8b;
		--clip-v: #211e30; --clip-v-bd: #34304f; --clip-v-on: #8f86e6; --clip-ink: #d6d1ff; --clip-dim: #9d96cc;
		--card-shadow: 0 1px 2px rgba(0,0,0,0.2);
		--ring: rgba(255,255,255,0.22);
		--r-sm: 8px; --r: 12px; --r-lg: 18px;
		--ease: cubic-bezier(0.2, 0.8, 0.2, 1);
		--mono: ui-monospace, 'SF Mono', Menlo, monospace;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { height: 100%; background: var(--bg); color: var(--ink); font: 12.5px/1.45 -apple-system, system-ui, 'Segoe UI', Inter, sans-serif; -webkit-font-smoothing: antialiased; }
	body { display: grid; grid-template-rows: 54px minmax(0, 1fr); height: 100vh; overflow: hidden; transition: background-color 0.25s, color 0.25s; }
	button { font: inherit; color: inherit; }
	kbd { font: 500 10px var(--mono); padding: 0 4px; border-radius: 4px; background: var(--btn); color: var(--dim); }
	.ic { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
	@keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } }
	@keyframes floatIn { from { opacity: 0; transform: translateY(4px); } }

	/* ---- title bar: no chrome, it sits on the app background ---- */
	.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13.5px; letter-spacing: -0.01em; }
	.brand .logo { width: 24px; height: 24px; border-radius: 7px; background: #f4f4f0; display: grid; place-items: center; box-shadow: 0 2px 8px -2px rgba(0,0,0,0.4); }
	.brand .logo svg { width: 14px; height: 14px; fill: #0f0f0c; }
	.toolbar .title { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	/* four zones, split by hairlines only: the bar, the player (video · controls · timeline), the notes */
	.toolbar { display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); }
	.toolbar .sep { width: 1px; height: 16px; background: var(--line-2); margin: 0 4px; }
	.tag { font: 600 9.5px/1 var(--mono); letter-spacing: 0.06em; padding: 3px 5px; border-radius: 3px; border: 1px solid var(--line-2); color: var(--dim); text-transform: uppercase; }
	.sp { flex: 1; }
	.btn { height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid transparent; background: var(--btn); color: var(--ink); font-size: 12.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
		transition: background-color 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease), transform 0.12s var(--ease), box-shadow 0.16s var(--ease); }
	.btn:hover { background: var(--btn-hover); }
	.btn:active { transform: scale(0.96); }
	.btn:focus-visible, .tool:focus-visible, .sw:focus-visible { outline: 2px solid var(--range); outline-offset: 2px; }
	.btn.on { background: var(--btn-on); }
	.btn.primary { background: var(--ink); color: #111; }
	.btn.primary:hover { background: #fff; box-shadow: 0 4px 14px -4px rgba(255,255,255,0.25); }
	.btn.ghost { background: transparent; color: var(--muted); }
	.btn.ghost:hover { background: var(--btn-hover); color: var(--ink); }
	.btn.icon { width: 30px; padding: 0; justify-content: center; }

	/* ---- workspace: video + timeline on the left, inspector on the right ---- */
	/* the notes panel closes to nothing at once (animating its width would resize the video every frame); it fades in when it opens */
	.side-off .work { grid-template-columns: minmax(0, 1fr) 0px; }
	.work { display: grid; grid-template-columns: minmax(0, 1fr) 372px; min-height: 0; overflow: clip; }
	.pane { background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
	.pane-hd { height: 30px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--muted); font-size: 12px; }
	.pane-hd strong { color: var(--ink); font-weight: 500; }
	.pane-hd .sp { flex: 1; }
	.pane-hd .fit { color: var(--dim); font-size: 11px; transition: opacity 0.16s; }

	/* centre: the video over the timeline */
	/* one column that the timeline can't stretch: its width comes from the window, never from the filmstrip inside it */
	.centre { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 187px; min-width: 0; min-height: 0; }
	.viewer { position: relative; background: transparent; }
	.viewer > .pane-hd { display: none; }
	.viewer-body { flex: 1; min-height: 0; display: grid; place-items: center; padding: 14px; position: relative; }
	.unplayable { max-width: 560px; color: var(--muted); font-size: 13px; line-height: 1.55; padding: 22px 24px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--card-shadow); }
	.unplayable b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; margin-bottom: 6px; }
	.unplayable code { display: block; margin: 12px 0 8px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--well); color: var(--ink); font: 12px var(--mono); overflow-wrap: anywhere; user-select: all; }
	.unplayable .dim { color: var(--dim); font-size: 12px; }
	/* the frame, square and uncropped; a 1px edge outside it so a dark video still has a boundary */
	#stage { position: relative; background: #000; overflow: hidden; box-shadow: 0 0 0 1px var(--line-2); }
	#stage:fullscreen { box-shadow: none; }
	#stage video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
	#comp { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; opacity: 0; pointer-events: none; }
	#overlay { position: absolute; inset: 0; }
	#overlay { cursor: pointer; }
	body.pointing #overlay { cursor: crosshair; }
	#ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
	body.drawing #ink { pointer-events: auto; cursor: crosshair; touch-action: none; }
	#ink path, #ink rect { fill: none; stroke-width: var(--sw, 7); stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
	#ink text { font: 700 var(--fs, 44px) -apple-system, system-ui, sans-serif; dominant-baseline: hanging; paint-order: stroke; stroke: rgba(0,0,0,0.6); stroke-width: 8px; stroke-linejoin: round; }
	body.drawing.tool-text #ink { cursor: text; }
	#inkText { position: absolute; z-index: 3; display: none; min-width: 60px; background: rgba(0,0,0,0.25); border: 1px dashed; border-radius: 4px; padding: 0 4px; font-weight: 700; font-family: -apple-system, system-ui, sans-serif; line-height: 1.1; outline: none; }
	/* while drawing, the palette takes the transport's place under the frame, so nothing covers or resizes the video */
	.drawbar { grid-column: 2; grid-row: 1; display: none; align-items: center; gap: 2px; padding: 3px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); }
	body.drawing .drawbar { display: flex; animation: floatIn 0.2s var(--ease); }
	body.drawing .viewer-ft .transport { display: none; }
	.drawbar .tool { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background-color 0.14s, color 0.14s, transform 0.12s var(--ease); }
	.drawbar .tool:hover { color: var(--ink); background: var(--btn-hover); }
	.drawbar .tool:active { transform: scale(0.92); }
	.drawbar .tool.on { background: var(--btn-on); color: var(--ink); }
	.drawbar .dv { width: 1px; height: 18px; background: var(--line-2); margin: 0 6px; }
	.drawbar .sw { width: 16px; height: 16px; border-radius: 50%; border: 0; margin: 0 3px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); transition: transform 0.14s var(--ease); }
	.drawbar .sw:hover { transform: scale(1.15); }
	.drawbar .sw.on { outline: 2px solid var(--ink); outline-offset: 2px; }
	#inkSize i { display: block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; transition: transform 0.14s var(--ease); }
	#inkSize[data-w='0'] i { transform: scale(0.5); } #inkSize[data-w='2'] i { transform: scale(1.35); }
	body.drawing.tool-erase #ink { cursor: cell; }
	#ink [data-note] { pointer-events: visiblePainted; cursor: pointer; }
	#ink .hit { pointer-events: stroke; filter: none; }
	body.drawing #ink [data-note], body.pointing #ink [data-note] { pointer-events: none; }
	#elBox { position: absolute; border: 1.5px solid var(--pin); border-radius: 4px; box-shadow: 0 0 0 3px rgba(239,106,76,0.18); pointer-events: none; display: none; }
	body.nomarks #elBox { display: none !important; }
	#hl { position: absolute; border: 1.5px solid var(--pin); background: rgba(239,106,76,0.08); border-radius: 4px; pointer-events: none; display: none; transition: left 0.08s, top 0.08s, width 0.08s, height 0.08s; }
	#hlTag { position: absolute; transform: translateY(-100%); margin-top: -5px; padding: 3px 8px; border-radius: 6px; background: var(--pin); color: #fff; font: 500 11px var(--mono); white-space: nowrap; pointer-events: none; display: none; max-width: 70%; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 12px -4px rgba(0,0,0,0.5); }
	.pin { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--pin); color: #fff; font: 700 11px/22px -apple-system, sans-serif; text-align: center; box-shadow: 0 0 0 3px rgba(239,106,76,0.35), 0 4px 10px rgba(0,0,0,0.35); cursor: pointer; transition: transform 0.14s var(--ease); }
	.pin:hover { transform: scale(1.12); }
	/* transport: a slim control row over the timeline, so the space above is all video */
	.viewer-ft { flex: none; height: 46px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 14px; border-bottom: 1px solid var(--line); }
	.tc { font: 500 12px var(--mono); color: var(--ink); letter-spacing: 0.02em; white-space: nowrap; }
	.tc .of { color: var(--dim); }
	.transport { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 2px; }
	.transport .btn { width: 30px; padding: 0; justify-content: center; }
	#prevScene, #nextScene { display: none; }
	.transport #play { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--bg); margin: 0 4px; }
	.transport #play:hover { box-shadow: 0 4px 14px -4px rgba(255,255,255,0.35); }
	.viewer-ft .tc { grid-column: 1; grid-row: 1; }
	.viewer-ft .right { grid-column: 3; grid-row: 1; justify-self: end; display: flex; align-items: center; gap: 2px; }

	/* timeline: ruler, the scenes as rounded segments, the notes lane */
	.timeline { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); }
	.tl-body { flex: 1; min-height: 0; overflow: hidden; padding: 4px 6px 10px; }
	#scroll { overflow: hidden; position: relative; padding: 0 8px; }
	#scroll::-webkit-scrollbar { height: 8px; }
	#scroll::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 4px; border: 2px solid var(--bg); }
	#inner { position: relative; user-select: none; cursor: ew-resize; min-width: 100%; }
	.H-notes { cursor: text; }
	.row { position: relative; }
	.H-ruler { height: 26px; } .H-pic { height: 60px; } .H-notes { height: 36px; }
	.ruler { cursor: ew-resize; }
	.ruler .tick { display: none; }
	.ruler .tick.big { display: block; position: absolute; bottom: 6px; width: 3px; height: 3px; margin-left: -1px; border-radius: 50%; background: var(--faint); }
	.ruler .lab { position: absolute; top: 4px; font: 500 10.5px -apple-system, system-ui, sans-serif; color: var(--dim); translate: -50% 0; white-space: nowrap; }
	.clip { position: absolute; top: 4px; bottom: 4px; border-radius: 10px; overflow: hidden; border: 1px solid; transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease); }
	.clip .cap { position: absolute; left: 5px; top: 5px; z-index: 1; max-width: calc(100% - 10px); height: 20px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 20px; }
	.clip .cap .ic { display: none; }
	.clip.pic { background: var(--clip-v); border-color: var(--clip-v-bd); color: var(--clip-ink); }
	.clip.pic:hover { border-color: var(--clip-v-on); }
	.clip.pic .cap { background: rgba(0,0,0,0.55); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
	.clip.pic .strip { position: absolute; inset: 0; overflow: hidden; background: #000; display: flex; opacity: 0.85; transition: opacity 0.2s var(--ease); }
	.clip.pic:hover .strip, .clip.pic.on .strip { opacity: 1; }
	.clip.pic .strip span { flex: none; height: 100%; background-repeat: no-repeat; border-right: 1px solid rgba(0,0,0,0.3); }
	.clip.pic .dur { display: none; }
	.clip.pic.on { border-color: var(--clip-v-on); box-shadow: 0 0 0 1px var(--clip-v-on), 0 6px 18px -8px var(--clip-v-on); }
	#rowNotes:empty::before { content: 'Comments · drag here for a range'; position: absolute; left: 8px; top: 11px; color: var(--faint); font-size: 11px; }
	/* every comment: a moment is a round marker centred on its frame; a range is a coloured segment over its stretch,
	   with the text if it fits. The tint says what kind; the width only ever means duration */
	.mk { --c: 138,138,130; position: absolute; top: 7px; height: 22px; min-width: 22px; translate: -50% 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 7px; border-radius: 11px; overflow: hidden; white-space: nowrap; z-index: 1;
		background: rgb(var(--c)); color: #fff; font: 700 10.5px/1 -apple-system, sans-serif; box-shadow: 0 0 0 2px var(--bg), 0 2px 6px rgba(0,0,0,0.3); transition: transform 0.16s var(--ease), box-shadow 0.16s var(--ease), background-color 0.16s; }
	.mk b { color: inherit; font-weight: 700; flex: none; }
	.mk span { overflow: hidden; text-overflow: ellipsis; }
	.mk.pt { --c: 239,106,76; } .mk.dw { --c: 255,79,139; } .mk.rg { --c: 111,179,255; }
	.mk:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--bg), 0 6px 14px -2px rgba(var(--c), 0.55); }
	.mk.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(var(--c), 0.7); }
	.mk.rg { translate: none; justify-content: flex-start; padding: 0 8px 0 7px; border-radius: 7px; background: rgba(var(--c), 0.16); border: 1px solid rgba(var(--c), 0.45); border-left: 3px solid rgb(var(--c)); color: var(--ink); font-weight: 500; box-shadow: none; }
	.mk.rg b { color: rgb(var(--c)); }
	.mk.rg:hover { background: rgba(var(--c), 0.26); box-shadow: 0 6px 14px -6px rgba(var(--c), 0.6); }
	.mk.rg.on { background: rgba(var(--c), 0.3); border-color: rgb(var(--c)); box-shadow: none; overflow: visible; }
	.mk em { font-style: normal; font-weight: 600; font-size: 9.5px; opacity: 0.85; }
	.mk .trim { position: absolute; top: 3px; bottom: 3px; width: 5px; border-radius: 3px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); cursor: ew-resize; }
	.mk .trim.l { left: -1px; } .mk .trim.r { right: 2px; }
	/* the note preview over a marker */
	#mkTip { position: fixed; z-index: 25; width: 260px; padding: 6px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 16px 40px -12px rgba(0,0,0,0.7); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity 0.14s var(--ease), transform 0.14s var(--ease); }
	#mkTip.on { opacity: 1; transform: none; }
	#mkTip .tp { display: grid; grid-template-columns: 72px 1fr; gap: 9px; padding: 5px; }
	#mkTip img, #mkTip .noimg { display: block; width: 72px; aspect-ratio: 16/9; border-radius: 5px; object-fit: cover; background: #000; }
	#mkTip .tp-hd { display: flex; align-items: center; gap: 5px; font: 500 10.5px var(--mono); color: var(--dim); }
	#mkTip .tp-hd u { text-decoration: none; color: var(--range); font-family: -apple-system, system-ui, sans-serif; }
	#mkTip .n { width: 15px; height: 15px; border-radius: 50%; background: var(--pin); color: #fff; font: 700 9px/15px -apple-system, sans-serif; text-align: center; flex: none; }
	#mkTip .n.r { background: var(--range); } #mkTip .n.t { background: #8a8a82; }
	#mkTip .tp-tx { margin-top: 3px; font-size: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
	#mkTip .tp-more { padding: 2px 5px 3px; font-size: 11px; color: var(--dim); }
	/* a range being dragged: drawn in the comments track, the same segment it becomes (26 + 60 = the rows above it) */
	#sel { position: absolute; top: calc(26px + 60px + 7px); height: 22px; background: rgba(111,179,255,0.18); border: 1px solid rgba(111,179,255,0.6); border-left: 3px solid var(--range); border-radius: 7px; display: none; pointer-events: none; z-index: 2; box-shadow: 0 6px 14px -6px rgba(111,179,255,0.5); }
	#hover { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.2); pointer-events: none; display: none; z-index: 3; }
	#head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--head); box-shadow: 0 0 10px rgba(239,106,76,0.45); pointer-events: none; z-index: 4; }
	#head::before { content: ''; position: absolute; top: 1px; left: -5px; width: 12px; height: 18px; border-radius: 6px; background: var(--head); box-shadow: 0 0 0 2px var(--bg), 0 2px 6px rgba(0,0,0,0.35); }

	/* inspector: one composer card, then the notes as quiet rows */
	.insp { background: transparent; padding: 0 16px 14px; border-left: 1px solid var(--line); overflow: clip; transition: opacity 0.2s var(--ease); }
	.insp > * { min-width: 339px; }
	.side-off .insp { opacity: 0; pointer-events: none; padding-left: 0; padding-right: 0; border-left-width: 0; transition: none; }
	#sideBtn { position: relative; }
	#sideN { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--pin); color: #fff; font: 700 9.5px/16px -apple-system, sans-serif; text-align: center; box-shadow: 0 0 0 2px var(--bg); opacity: 0; transform: scale(0.6); transition: opacity 0.18s, transform 0.18s var(--ease); pointer-events: none; }
	.side-off #sideN:not(:empty) { opacity: 1; transform: none; }
	.insp > .pane-hd { height: 46px; padding: 0 4px 0 6px; }
	.insp > .pane-hd strong { font-weight: 600; font-size: 13px; }
	.composer { padding: 12px 12px 10px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--card-shadow); transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease); }
	.composer:focus-within { border-color: var(--line-2); box-shadow: var(--card-shadow), 0 0 0 4px rgba(255,255,255,0.04); }
	.cm-where { display: flex; align-items: center; gap: 8px; min-width: 0; }
	/* the anchor (time) and what's attached (chips) share one shape, so the header reads as one block */
	.cm-tc { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 7px; font: 500 11px var(--mono); color: var(--muted); white-space: nowrap; background: var(--btn); }
	.cm-scene { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.chips { display: flex; flex-wrap: wrap; gap: 6px; }
	.chips:empty { display: none; }
	.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 24px; padding: 0 3px 0 8px; border-radius: 7px; font-size: 11.5px; border: 1px solid; }
	.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.chip.pt { color: #ffb9a8; border-color: rgba(239,106,76,0.45); background: rgba(239,106,76,0.12); }
	.chip.rg { color: #b9dbff; border-color: rgba(111,179,255,0.45); background: rgba(111,179,255,0.12); }
	.chip.dw { color: #ffb3cd; border-color: rgba(255,79,139,0.45); background: rgba(255,79,139,0.12); }
	.chip.arm { color: var(--muted); border-color: var(--line-2); border-style: dashed; padding-right: 8px; }
	.chip button { width: 18px; height: 18px; border-radius: 5px; border: 0; background: rgba(255,255,255,0.08); color: inherit; cursor: pointer; line-height: 1; flex: none; transition: background-color 0.14s; }
	.chip button:hover { background: rgba(255,255,255,0.18); }
	#cmText { width: 100%; height: 58px; resize: none; border: 0; background: transparent; color: var(--ink); padding: 2px; font: 13.5px/1.45 -apple-system, system-ui, sans-serif; outline: none; }
	#cmText::placeholder { color: var(--dim); }
	.cm-row { display: flex; align-items: center; gap: 6px; }
	.cm-row .btn.icon { width: 32px; height: 32px; }
	.cm-row .btn.icon .ic { width: 15px; height: 15px; }
	.cm-row .btn.primary { height: 32px; padding: 0 14px; }
	#pointBtn.on { background: rgba(239,106,76,0.16); border-color: rgba(239,106,76,0.6); color: #ffb9a8; }
	#drawBtn.on { background: rgba(255,79,139,0.16); border-color: rgba(255,79,139,0.6); color: #ffb3cd; }
	.insp-body { flex: 1; min-height: 0; overflow: auto; margin: 0 -4px; padding: 0 4px; }
	.insp-body::-webkit-scrollbar { width: 8px; }
	.insp-body::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 4px; border: 2px solid var(--bg); }
	#list { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; }
	.note { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 10px; border-radius: var(--r); border: 1px solid transparent; background: transparent; cursor: pointer; transition: background-color 0.16s var(--ease), border-color 0.16s var(--ease), box-shadow 0.16s var(--ease), opacity 0.2s; }
	.note:hover { background: var(--btn); }
	.note.active { background: var(--panel); border-color: var(--line); box-shadow: 0 8px 22px -14px rgba(0,0,0,0.6); }
	.note img, .note .noimg { width: 72px; aspect-ratio: 16/9; border-radius: 6px; object-fit: cover; background: #000; box-shadow: 0 0 0 1px var(--line); }
	.note .hd { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); min-width: 0; }
	.note .hd .scn { display: none; }
	.note .n { width: 16px; height: 16px; border-radius: 50%; background: var(--pin); color: #fff; font: 700 9.5px/16px -apple-system, sans-serif; text-align: center; flex: none; }
	.note .n.r { background: var(--range); }
	.note .n.t { background: #8a8a82; }
	.note .tcs { font: 500 10.5px var(--mono); color: var(--dim); white-space: nowrap; }
	.note .txt { margin-top: 3px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
	.note .el { margin-top: 3px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.note .acts { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity 0.14s; }
	.note .acts button { width: 22px; height: 22px; border-radius: 6px; color: var(--dim); background: none; border: 0; cursor: pointer; font-size: 15px; line-height: 1; display: grid; place-items: center; transition: background-color 0.14s, color 0.14s; }
	.note .acts svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
	.note:hover .acts, .note.active .acts { opacity: 1; }
	.note .acts button:hover { color: var(--ink); background: var(--btn-hover); }
	/* something new from your agent: a blue dot on the note, its marker, and the notes button when the panel is closed */
	.note .hd .new { width: 7px; height: 7px; border-radius: 50%; background: var(--range); flex: none; box-shadow: 0 0 0 3px rgba(111,179,255,0.18); }
	.mk.new::after { content: ''; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--range); box-shadow: 0 0 0 2px var(--bg); }
	.mk:not(.rg) { overflow: visible; }
	#sideBtn.new::after { content: ''; position: absolute; top: -3px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--range); box-shadow: 0 0 0 2px var(--bg); opacity: 0; transition: opacity 0.18s; }
	.side-off #sideBtn.new::after { opacity: 1; }
	/* Before / Now: the frame you commented on, and the same moment after the re-render */
	.cmp { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
	.cmp figure { position: relative; margin: 0; }
	.cmp img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 7px; background: #000; box-shadow: 0 0 0 1px var(--line); }
	.cmp figcaption { position: absolute; left: 5px; top: 5px; padding: 1px 6px; border-radius: 5px; font-size: 10px; font-weight: 500; color: #fff; background: rgba(0,0,0,0.55); }
	.empty { color: var(--dim); padding: 16px; font-size: 12.5px; line-height: 1.65; border: 1px dashed var(--line-2); border-radius: var(--r); }
	.empty b { color: var(--muted); font-weight: 500; }
	.insp-ft { padding-top: 12px; display: flex; gap: 8px; }
	.insp-ft .btn { height: 36px; border-radius: 10px; padding: 0 14px; }
	.insp-ft #clear { background: transparent; border-color: transparent; box-shadow: none; color: var(--dim); }
	.insp-ft #clear:hover { background: var(--btn-hover); color: var(--ink); }
	.insp-ft .btn.primary { flex: 1; justify-content: center; }

	#toast { position: fixed; top: 62px; left: 50%; transform: translate(-50%, -8px) scale(0.98); opacity: 0; pointer-events: none; background: var(--ink); color: #111; padding: 9px 16px; border-radius: 999px; font-weight: 500; z-index: 10; box-shadow: 0 12px 30px -10px rgba(0,0,0,0.6); transition: opacity 0.2s var(--ease), transform 0.2s var(--ease); }
	#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
	#toast.act.show { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding-right: 6px; }
	#toast button { height: 26px; padding: 0 11px; border-radius: 999px; border: 0; background: rgba(0,0,0,0.12); color: inherit; font: 600 12px -apple-system, system-ui, sans-serif; cursor: pointer; }
	#toast button:hover { background: rgba(0,0,0,0.2); }
	:root[data-theme='light'] #toast button { background: rgba(255,255,255,0.18); }
	/* confirm dialog, in place of the browser's own */
	#modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,0.5); opacity: 0; visibility: hidden; transition: opacity 0.18s var(--ease), visibility 0.18s; }
	#modal.on { opacity: 1; visibility: visible; }
	#modal .card { width: 100%; max-width: 380px; padding: 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 24px 60px -16px rgba(0,0,0,0.7); transform: translateY(6px) scale(0.97); transition: transform 0.2s var(--ease); }
	#modal.on .card { transform: none; }
	#modal b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
	#modal p { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
	#modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
	#modal .btn { height: 32px; padding: 0 14px; }
	#modal .btn.danger { background: #e5484d; color: #fff; }
	#modal .btn.danger:hover { background: #d93d42; box-shadow: 0 4px 14px -4px rgba(229,72,77,0.5); }

	/* agent round-trip: statuses, the thread under a note, a reply box on the selected note */
	.showres { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 11.5px; cursor: pointer; user-select: none; }
	.showres input { appearance: none; -webkit-appearance: none; position: relative; width: 26px; height: 16px; border-radius: 8px; background: var(--btn-on); cursor: pointer; transition: background-color 0.18s var(--ease); }
	.showres input::before { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform 0.18s var(--ease), background-color 0.18s; }
	.showres input:checked { background: var(--ink); }
	.showres input:checked::before { transform: translateX(10px); background: var(--bg); }
	.showres input:focus-visible { outline: 2px solid var(--range); outline-offset: 2px; }
	.note.resolved, .note.dismissed { opacity: 0.55; }
	.note.resolved:hover, .note.dismissed:hover, .note.resolved.active, .note.dismissed.active { opacity: 0.85; }
	.note.dismissed .txt { text-decoration: line-through; }
	.note .st { font: 600 9px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; flex: none; }
	.note .st.resolved { color: #7fe0a6; background: rgba(111,214,155,0.14); }
	.note .st.dismissed { color: var(--dim); background: rgba(255,255,255,0.06); }
	.thread { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
	.msg { font-size: 12px; line-height: 1.45; padding: 8px 10px; border-radius: 10px; background: var(--well); border: 1px solid var(--line); white-space: pre-wrap; }
	.msg i { display: flex; align-items: baseline; gap: 6px; font-style: normal; font: 600 9.5px var(--mono); color: var(--dim); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
	.msg .ago { font: 400 10px -apple-system, system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: var(--dim); }
	.msg.agent { border-color: rgba(111,179,255,0.3); background: rgba(111,179,255,0.06); }
	.msg.agent i { color: var(--range); }
	.reply { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 6px; }
	.reply textarea { flex: 1; min-width: 0; height: 30px; max-height: 140px; resize: none; overflow-y: auto; border-radius: 9px; border: 1px solid var(--line); background: var(--well); color: var(--ink); padding: 6px 10px; font: 12px/1.45 -apple-system, system-ui, sans-serif; outline: none; transition: border-color 0.16s, box-shadow 0.16s; }
	.reply textarea:focus { border-color: var(--line-2); box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }
	.reply .btn { height: 30px; flex: none; }
	.pop { position: fixed; top: 50px; right: 18px; width: 420px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; padding: 16px; display: none; z-index: 20; box-shadow: 0 24px 60px -16px rgba(0,0,0,0.85); transform-origin: top right; }
	.pop.on { display: block; animation: popIn 0.18s var(--ease); }
	.pop b { display: block; font-size: 13px; margin-bottom: 6px; }
	.pop p { color: var(--muted); font-size: 12px; line-height: 1.55; margin-bottom: 12px; }
	.pop code { display: block; font: 11.5px var(--mono); background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; color: var(--ink); overflow-wrap: anywhere; white-space: pre-wrap; }
	.pop .dd { position: relative; margin-bottom: 8px; }
	.pop .dd-btn, .pop .dd-menu button { width: 100%; display: flex; align-items: center; gap: 9px; color: var(--ink); font-size: 12.5px; cursor: pointer; text-align: left; }
	.pop .dd-btn { height: 36px; padding: 0 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--btn); transition: background-color 0.14s; }
	.pop .dd-btn:hover { background: var(--btn-hover); }
	.pop .dd-btn .chev { margin-left: auto; width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s var(--ease); }
	.pop .dd.open .chev { transform: rotate(180deg); }
	.pop .dd-menu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 4px; display: none; z-index: 1; box-shadow: 0 16px 40px -12px rgba(0,0,0,0.8); transform-origin: top center; }
	.pop .dd.open .dd-menu { display: block; animation: popIn 0.16s var(--ease); }
	.pop .dd-menu button { height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; transition: background-color 0.12s; }
	.pop .dd-menu button:hover { background: var(--btn-hover); }
	.pop .dd-menu button.on::after { content: '✓'; margin-left: auto; color: var(--muted); }
	.pop .lg { width: 16px; height: 16px; flex: none; }
	.pop .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
	.pop .dim { color: var(--dim); font-size: 11px; flex: 1; }
	.pop .dim i { font-style: normal; font-family: var(--mono); color: var(--muted); }

	/* agent-written and acknowledged notes; H hides saved markers */
	.tagp { font: 600 9px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; flex: none; }
	.tagp.agent { color: #b9dbff; background: rgba(111,179,255,0.14); }
	.note .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
	.note .st.acknowledged { color: #b9dbff; background: rgba(111,179,255,0.14); }
	body.nomarks .pin:not(.draft) { display: none; }
	/* ---- light theme (follows the system; the toolbar toggle remembers a choice). The video frame is left as it is ---- */
	:root[data-theme='light'] {
		--bg: #f2f2f0; --chrome: #f2f2f0; --panel: #ffffff; --panel-2: #fafaf9; --well: #f5f5f3;
		--line: rgba(0,0,0,0.07); --line-2: rgba(0,0,0,0.12);
		--ink: #1b1b1a; --muted: #585752; --dim: #8e8d87; --faint: #b3b2ac;
		--btn: #ffffff; --btn-hover: #f6f6f4; --btn-on: #ebebe8;
		--range: #2a7bd5;
		--clip-v: #ebe8fc; --clip-v-bd: #d6d0f5; --clip-v-on: #7d72dc; --clip-ink: #3a3170; --clip-dim: #7f77b0;
		--card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px -4px rgba(0,0,0,0.06);
		--ring: rgba(0,0,0,0.18);
	}
	:root[data-theme='light'] .brand .logo { background: #1b1b1a; }
	:root[data-theme='light'] .brand .logo svg { fill: #fff; }
	:root[data-theme='light'] .btn { border-color: var(--line); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
	:root[data-theme='light'] .btn.ghost, :root[data-theme='light'] .transport .btn { border-color: transparent; box-shadow: none; background: transparent; }
	:root[data-theme='light'] .btn.ghost:hover, :root[data-theme='light'] .transport .btn:hover { background: rgba(0,0,0,0.05); }
	:root[data-theme='light'] .transport #play { background: var(--ink); }
	:root[data-theme='light'] .btn.primary, :root[data-theme='light'] #toast { color: #fff; }
	:root[data-theme='light'] .btn.primary { border-color: var(--ink); }
	:root[data-theme='light'] .btn.primary:hover, :root[data-theme='light'] .transport #play:hover { background: #000; box-shadow: 0 4px 14px -4px rgba(0,0,0,0.35); }
	:root[data-theme='light'] .drawbar .tool:hover { background: rgba(0,0,0,0.05); }
	:root[data-theme='light'] .drawbar .tool.on { background: rgba(0,0,0,0.08); }
	:root[data-theme='light'] #scroll::-webkit-scrollbar-thumb, :root[data-theme='light'] .insp-body::-webkit-scrollbar-thumb { background: #d2d2cd; }
	:root[data-theme='light'] .mk { box-shadow: 0 0 0 2px var(--bg), 0 2px 6px rgba(0,0,0,0.15); }
	:root[data-theme='light'] .mk.rg { --c: 42,123,213; box-shadow: none; }
	:root[data-theme='light'] #hover { background: rgba(0,0,0,0.18); }
	:root[data-theme='light'] #head::before { box-shadow: 0 0 0 2px var(--bg), 0 2px 6px rgba(0,0,0,0.2); }
	:root[data-theme='light'] .chip.pt, :root[data-theme='light'] #pointBtn.on { color: #b8401f; }
	:root[data-theme='light'] .chip.dw, :root[data-theme='light'] #drawBtn.on { color: #b3245a; }
	:root[data-theme='light'] .chip.rg { color: #1f63b0; }
	:root[data-theme='light'] .chip button { background: rgba(0,0,0,0.06); }
	:root[data-theme='light'] .chip button:hover { background: rgba(0,0,0,0.12); }
	:root[data-theme='light'] .reply textarea:focus, :root[data-theme='light'] .composer:focus-within { box-shadow: 0 0 0 3px rgba(0,0,0,0.04); }
	:root[data-theme='light'] .note:hover { background: rgba(0,0,0,0.03); }
	:root[data-theme='light'] .cm-tc { background: rgba(0,0,0,0.045); }
	:root[data-theme='light'] .showres input { background: #dcdcd8; }
	:root[data-theme='light'] .showres input::before { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
	:root[data-theme='light'] .showres input:checked::before { background: #fff; }
	:root[data-theme='light'] .note.active { box-shadow: 0 10px 24px -14px rgba(40,30,80,0.3); }
	:root[data-theme='light'] .note .n.t { background: #a3a39c; }
	:root[data-theme='light'] .note .st.resolved { color: #1f8a4c; background: rgba(31,138,76,0.12); }
	:root[data-theme='light'] .note .st.dismissed { background: rgba(0,0,0,0.05); }
	:root[data-theme='light'] .note .st.acknowledged, :root[data-theme='light'] .tagp.agent { color: #1f63b0; background: rgba(42,123,213,0.12); }
	:root[data-theme='light'] .msg.agent { border-color: rgba(42,123,213,0.28); background: rgba(42,123,213,0.05); }
	:root[data-theme='light'] .pop { box-shadow: 0 24px 60px -16px rgba(40,30,80,0.3); }
	:root[data-theme='light'] .pop .dd-menu { box-shadow: 0 16px 40px -12px rgba(40,30,80,0.25); }
	:root[data-theme='light'] #toast { box-shadow: 0 12px 30px -10px rgba(0,0,0,0.3); }
	:root[data-theme='light'] #modal { background: rgba(20,20,18,0.25); }
	:root[data-theme='light'] #modal .card { box-shadow: 0 24px 60px -16px rgba(40,30,80,0.3); }
	:root[data-theme='light'] #modal .btn.danger { border-color: #e5484d; }
	#themeBtn .sun { display: none; }
	:root[data-theme='light'] #themeBtn .sun { display: block; }
	:root[data-theme='light'] #themeBtn .moon { display: none; }
	@media (prefers-reduced-motion: reduce) {
		*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
	}
</style>
</head>
<body>
<div class="toolbar">
	<div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M7.5 4.8v11.4a1 1 0 0 0 1.5.9l9.3-5.7a1 1 0 0 0 0-1.7L9 4a1 1 0 0 0-1.5.8z"/><path d="M4.2 20.6c5.4-1.1 10.4-1.6 15.6-1.9" fill="none" stroke="#ef6a4c" stroke-width="2.3" stroke-linecap="round"/></svg></span>telestrator</div>
	<span class="sep"></span>
	<span class="title" id="title"></span>
	<span class="sp"></span>
	<button class="btn" id="mcpBtn" title="Let your agent read these notes"><svg class="ic" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Connect agent</button>
	<button class="btn icon" id="sideBtn" title="Hide notes (S)"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M14.5 4.5v15"/></svg><span id="sideN"></span></button>
	<button class="btn icon" id="themeBtn" title="Light / dark"><svg class="ic moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
</div>

<div class="work">
	<section class="centre">
		<div class="pane viewer">
			<div class="pane-hd"><strong id="vName"></strong><span class="sp"></span><span class="fit" id="compState"></span></div>
			<div class="viewer-body" id="vbody">
				<div id="stage">
					<video id="v" preload="auto" playsinline></video>
					<iframe id="comp" title="composition (hit-testing only)"></iframe>
					<div id="overlay"><div id="hl"></div><div id="hlTag"></div><div id="elBox"></div></div>
					<svg id="ink" preserveAspectRatio="none"></svg>
					<input id="inkText" autocomplete="off" spellcheck="false" />
				</div>
			</div>
		</div>

		<div class="timeline">
			<div class="viewer-ft">
				<span class="tc" id="tc">00:00:00:00</span>
				<div class="transport">
					<button class="btn ghost" id="prevScene" title="Previous scene (↑)"><svg class="ic" viewBox="0 0 24 24"><path d="M6 5v14M18 5l-9 7 9 7z"/></svg></button>
					<button class="btn ghost" id="back" title="Back 1 frame (←)"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
					<button class="btn ghost" id="play" title="Play/pause (Space)"><svg class="ic" viewBox="0 0 24 24" id="playIc"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg></button>
					<button class="btn ghost" id="fwd" title="Forward 1 frame (→)"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
					<button class="btn ghost" id="nextScene" title="Next scene (↓)"><svg class="ic" viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z"/></svg></button>
				</div>
				<div class="drawbar" id="drawbar">
					<button class="tool on" data-tool="pen" title="Pen"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"/></svg></button>
					<button class="tool" data-tool="arrow" title="Arrow"><svg class="ic" viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
					<button class="tool" data-tool="box" title="Box"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
					<button class="tool" data-tool="text" title="Text"><svg class="ic" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg></button>
					<button class="tool" data-tool="erase" title="Eraser: click a mark to remove it"><svg class="ic" viewBox="0 0 24 24"><path d="M8 20h11M5.5 15.5l8-8 5 5-6.5 6.5H9z"/><path d="M9.5 11.5l5 5"/></svg></button>
					<button class="tool" id="inkSize" data-w="1" title="Regular stroke"><i></i></button>
					<span class="dv"></span>
					<button class="sw on" data-c="#ff4f8b" title="Pink" style="background:#ff4f8b"></button>
					<button class="sw" data-c="#ff453a" title="Red" style="background:#ff453a"></button>
					<button class="sw" data-c="#ffd60a" title="Yellow" style="background:#ffd60a"></button>
					<button class="sw" data-c="#32d74b" title="Green" style="background:#32d74b"></button>
					<button class="sw" data-c="#0a84ff" title="Blue" style="background:#0a84ff"></button>
					<button class="sw" data-c="#ffffff" title="White" style="background:#ffffff"></button>
					<span class="dv"></span>
					<button class="tool" id="undoInk" title="Undo · ⌘Z"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
				</div>
				<div class="right"><button class="btn ghost icon" id="audioBtn" title="Sound on (M)"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button><button class="btn ghost icon" id="fs" title="Fullscreen (F)"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
			</div>
			<div class="tl-body">
				<div id="scroll">
					<div id="inner">
						<div class="row H-ruler ruler" id="ruler"></div>
						<div class="row H-pic" id="rowPic"></div>
						<div class="row H-notes" id="rowNotes"></div>
						<div id="sel"></div><div id="hover"></div><div id="head"></div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<aside class="pane insp">
		<div class="pane-hd"><strong>Notes</strong><span class="n" id="nNotes3" style="font-size:11.5px;color:var(--dim)"></span><span class="sp"></span><label class="showres"><input type="checkbox" id="showResolved" /> Show resolved</label></div>
		<div class="composer">
			<div class="cm-where"><span class="cm-tc" id="cmTc"></span><span class="cm-scene" id="cmScene"></span></div>
			<div class="chips" id="cmChips"></div>
			<textarea id="cmText" placeholder="What should change here?"></textarea>
			<div class="cm-row">
				<button class="btn icon" id="pointBtn" title="Point at something in the frame · P" aria-label="Point"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></button>
				<button class="btn icon" id="drawBtn" title="Draw on the frame · D" aria-label="Draw"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M13 7l3 3"/></svg></button>
				<span class="sp"></span>
				<button class="btn ghost" id="cmCancel" style="display:none">Cancel</button>
				<button class="btn primary" id="cmAdd" title="⌘↵">Add note</button>
			</div>
		</div>
		<div class="insp-body"><div id="list"></div></div>
		<div class="insp-ft"><button class="btn" id="clear" title="Delete all notes">Clear</button><button class="btn primary" id="copy" title="Copy the open notes as markdown">Copy for agent</button></div>
	</aside>
</div>

<div id="toast"></div>
<div id="mkTip"></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="card"><b id="modalTitle"></b><p id="modalBody"></p><div class="acts"><button class="btn ghost" id="modalNo">Cancel</button><button class="btn danger" id="modalYes"></button></div></div></div>
<div id="mcpPop" class="pop"><b>Let your agent read these notes</b><p>Add the MCP server once; then ask your agent to “check the video feedback”. It sees every open note with its frame and drawing, can reply to you here, and resolves notes as it fixes them.</p><div class="dd" id="mcpDd"><button class="dd-btn" id="mcpPick" title="Which agent"><span id="mcpCur" style="display:contents"></span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="dd-menu" id="mcpMenu"></div></div><code id="mcpCmd"></code><div class="row"><span class="dim" id="mcpHint"></span><button class="btn primary" id="mcpCopy">Copy</button></div></div>
<script src="/ui/logos.js"></script>
<script src="/ui/app.js"></script>
